<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0F1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="res-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>
    <linearGradient id="score-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Window Header -->
  <rect width="1200" height="675" rx="14" fill="url(#res-bg)"/>
  <rect width="1200" height="48" rx="14" fill="#1A1D27"/>
  <rect y="38" width="1200" height="10" fill="#1A1D27"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#2B3040" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="24" r="6" fill="#27C93F"/>

  <!-- Address Bar -->
  <rect x="360" y="10" width="480" height="28" rx="6" fill="#0F1117" stroke="#2B3040"/>
  <text x="600" y="28" font-size="12" fill="#8E95A5" text-anchor="middle" font-family="'Geist Mono',monospace">resumeai4u.vercel.app</text>

  <!-- App Header -->
  <rect x="0" y="48" width="1200" height="64" fill="#141722"/>
  <line x1="0" y1="112" x2="1200" y2="112" stroke="#2B3040" stroke-width="1"/>
  <text x="48" y="88" font-size="20" font-weight="700" fill="#FFFFFF">ResumeAI4u<tspan fill="#F05A28">.</tspan></text>
  <rect x="180" y="74" width="130" height="24" rx="4" fill="#F05A28" fill-opacity="0.15"/>
  <text x="245" y="90" font-size="11" font-weight="600" fill="#F05A28" text-anchor="middle">ATS MATCH ENGINE</text>

  <rect x="1000" y="68" width="152" height="36" rx="6" fill="#F05A28"/>
  <text x="1076" y="91" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Analyze New Resume</text>

  <!-- Top Metrics Bar -->
  <rect x="48" y="136" width="340" height="110" rx="12" fill="#1A1E2A" stroke="#2B3040"/>
  <text x="72" y="166" font-size="12" font-weight="600" fill="#9CA3AF">ATS MATCH SCORE</text>
  <text x="72" y="214" font-size="40" font-weight="800" fill="#10B981">88<tspan font-size="22" font-weight="600">%</tspan></text>
  <rect x="180" y="174" width="180" height="10" rx="5" fill="#242B3D"/>
  <rect x="180" y="174" width="158" height="10" rx="5" fill="url(#score-grad)"/>
  <text x="180" y="206" font-size="11" fill="#34D399">✓ High likelihood to pass initial screening</text>

  <rect x="412" y="136" width="360" height="110" rx="12" fill="#1A1E2A" stroke="#2B3040"/>
  <text x="436" y="166" font-size="12" font-weight="600" fill="#9CA3AF">TARGET ROLE</text>
  <text x="436" y="196" font-size="16" font-weight="700" fill="#FFFFFF">Frontend Engineer · React &amp; TypeScript</text>
  <text x="436" y="222" font-size="12" fill="#F05A28">Analyzed against Job Description (1,420 words)</text>

  <rect x="796" y="136" width="356" height="110" rx="12" fill="#1A1E2A" stroke="#2B3040"/>
  <text x="820" y="166" font-size="12" font-weight="600" fill="#9CA3AF">KEYWORD DENSITY</text>
  <text x="820" y="200" font-size="22" font-weight="700" fill="#FFFFFF">18 / 22 Matched</text>
  <text x="820" y="224" font-size="12" fill="#9CA3AF">4 Critical Missing Keywords</text>

  <!-- Left: Keyword Analysis Breakdown -->
  <rect x="48" y="270" width="536" height="370" rx="12" fill="#1A1E2A" stroke="#2B3040"/>
  <text x="72" y="304" font-size="15" font-weight="700" fill="#FFFFFF">Keyword Gap Analysis</text>
  <text x="72" y="324" font-size="12" fill="#9CA3AF">Identified from JD requirements vs your uploaded resume</text>

  <!-- Found Keywords -->
  <text x="72" y="360" font-size="11" font-weight="600" fill="#34D399">MATCHED KEYWORDS (STRONG RELEVANCE)</text>
  <rect x="72" y="374" width="84" height="26" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="114" y="391" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">React 19</text>

  <rect x="166" y="374" width="94" height="26" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="213" y="391" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">TypeScript</text>

  <rect x="270" y="374" width="94" height="26" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="317" y="391" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">REST APIs</text>

  <rect x="374" y="374" width="104" height="26" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="426" y="391" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">Tailwind CSS</text>

  <!-- Missing Keywords -->
  <text x="72" y="440" font-size="11" font-weight="600" fill="#F87171">MISSING SKILLS (RECOMMENDED TO ADD)</text>
  <rect x="72" y="454" width="88" height="26" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="116" y="471" font-size="11" font-weight="600" fill="#F87171" text-anchor="middle">+ CI/CD</text>

  <rect x="170" y="454" width="98" height="26" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="219" y="471" font-size="11" font-weight="600" fill="#F87171" text-anchor="middle">+ Unit Tests</text>

  <rect x="278" y="454" width="92" height="26" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
  <text x="324" y="471" font-size="11" font-weight="600" fill="#F87171" text-anchor="middle">+ GraphQL</text>

  <rect x="72" y="520" width="488" height="96" rx="8" fill="#131620" stroke="#2B3040"/>
  <text x="92" y="546" font-size="12" font-weight="600" fill="#F05A28">Formatting &amp; Readability Check:</text>
  <text x="92" y="570" font-size="12" fill="#D1D5DB">✓ Standard one-column structure detected (no complex multi-column tables)</text>
  <text x="92" y="594" font-size="12" fill="#D1D5DB">✓ Clean chronological experience order · Action verbs score: 92/100</text>

  <!-- Right: AI Bullet Point Rewrites -->
  <rect x="612" y="270" width="540" height="370" rx="12" fill="#1A1E2A" stroke="#2B3040"/>
  <text x="636" y="304" font-size="15" font-weight="700" fill="#FFFFFF">AI-Powered Optimization Suggestions</text>
  <text x="636" y="324" font-size="12" fill="#9CA3AF">Generated via Groq LLaMA-3 analysis of bullet impact</text>

  <!-- Suggestion Card 1 -->
  <rect x="636" y="348" width="492" height="125" rx="8" fill="#131620" stroke="#374151"/>
  <text x="652" y="372" font-size="11" font-weight="600" fill="#EF4444">BEFORE (WEAK IMPACT):</text>
  <text x="652" y="392" font-size="12" fill="#9CA3AF">"Worked on building frontend components and connected them to APIs."</text>
  <text x="652" y="422" font-size="11" font-weight="600" fill="#10B981">SUGGESTED REWRITE (STRONG ACTION VERB + METRIC):</text>
  <text x="652" y="442" font-size="12" font-weight="600" fill="#FFFFFF">"Architected 14+ reusable React components, decreasing page load time by 32%."</text>

  <!-- Suggestion Card 2 -->
  <rect x="636" y="490" width="492" height="125" rx="8" fill="#131620" stroke="#374151"/>
  <text x="652" y="514" font-size="11" font-weight="600" fill="#EF4444">BEFORE (PASSIVE TONE):</text>
  <text x="652" y="534" font-size="12" fill="#9CA3AF">"Helped with testing the application and fixing bugs reported by users."</text>
  <text x="652" y="564" font-size="11" font-weight="600" fill="#10B981">SUGGESTED REWRITE:</text>
  <text x="652" y="584" font-size="12" font-weight="600" fill="#FFFFFF">"Spearheaded end-to-end integration testing, eliminating 25+ critical edge-case bugs."</text>
</svg>
