  <text x="336" y="270" font-size="13" fill="#D1D5DB">Based on Section 3.4 of your uploaded notes:</text>
  <text x="336" y="296" font-size="12" fill="#E5E7EB">• <tspan font-weight="600" fill="#FFFFFF">Binary Semaphore:</tspan> Value can range only between 0 and 1. Used as a mutual exclusion lock.</text>
  <text x="336" y="324" font-size="12" fill="#E5E7EB">• <tspan font-weight="600" fill="#FFFFFF">Counting Semaphore:</tspan> Value can range over an unrestricted domain. Used to control access</text>
